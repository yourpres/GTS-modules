<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Spartan Graduate Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" role="img">
        <circle cx="32" cy="32" r="30" fill="currentColor"></circle>
        <path d="M47 16c-18-1-29 8-29 22v11c4-4 9-7 15-8 4-.7 9 .2 14 3-2-4-6-7-11-8-5-1-9 0-13 2 1-11 9-17 24-17v-5Z" fill="#fff"></path>
        <path d="M39 24c-10 1-15 6-15 15v7c2-5 6-8 12-10 3-1 6-1 10 1-2-3-5-5-9-6-3-.7-6-.4-9 1 2-4 5-6 11-7v-1Z" fill="#fff"></path>
        <path d="M21 49h11c-2 4-5 7-10 9l-1-9Z" fill="#fff"></path>
      </svg>
    </div>
    <h1>Red Spartan Graduate Tracer</h1>
  </header>

  <section class="role-panel" aria-label="Role selection">
    <div>
      <p class="eyebrow">Reporting view</p>
      <h2 id="roleTitle">Admin Module Access</h2>
    </div>
    <div class="role-buttons" role="tablist" aria-label="Select role">
      <button class="role-button active" type="button" data-role="admin" role="tab" aria-selected="true">Admin</button>
      <button class="role-button" type="button" data-role="programChair" role="tab" aria-selected="false">Program Chair</button>
      <button class="role-button" type="button" data-role="externalAffairs" role="tab" aria-selected="false">External Affairs</button>
      <button class="role-button" type="button" data-role="vcaa" role="tab" aria-selected="false">VCAA</button>
    </div>
  </section>

  <section class="column-labels" aria-hidden="true">
    <span>Modules</span>
    <span id="submoduleLabel">Submodules / Reports</span>
  </section>

  <main class="map" id="moduleMap" aria-live="polite"></main>
</div>

<script src="script.js"></script>
</body>
</html>
